services:
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: speech
      POSTGRES_PASSWORD: speech
      POSTGRES_DB: speech
    volumes:
      - transcripts:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "speech", "-d", "speech"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://speech:speech@db:5432/speech
      HF_HOME: /models
    volumes:
      - models:/models
    depends_on:
      db:
        condition: service_healthy
volumes:
  transcripts:
  models:
